manifestVersion: subsquid.io/v0.1
name: prime-eth-squid
version: 15
description: 'Prime Staked ETH 🦑'
build:
deploy:
  addons:
    postgres:
    rpc:
      - eth.http
  secrets:
    - RPC_ENDPOINT
    - RPC_ENV
  processor:
    - name: lrt-processor
      cmd: ['sqd', 'process:lrt:prod']
  api:
    cmd:
      - npx
      - squid-graphql-server
      - '--dumb-cache'
      - in-memory
      - '--dumb-cache-ttl'
      - '5000'
      - '--dumb-cache-size'
      - '100'
      - '--dumb-cache-max-age'
      - '5000'
scale:
  dedicated: true
  addons:
    postgres:
      storage: 20G
      profile: small
